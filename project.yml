name: Banner
options:
  bundleIdPrefix: com.cornellana
  deploymentTarget:
    iOS: "17.0"
  knownRegions: [en, es, ca]
  developmentLanguage: en
targets:
  Banner:
    type: application
    platform: iOS
    sources: [Banner]
    # Info.plist propio (en vez de generado) porque el manifiesto de escenas es
    # un diccionario y no puede expresarse con los ajustes INFOPLIST_KEY_*.
    info:
      path: Banner/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
            # Rol anterior a iOS 16: algunas versiones lo siguen pidiendo al
            # conectar por AirPlay, así que se declara también.
            UIWindowSceneSessionRoleExternalDisplay:
              - UISceneConfigurationName: External Display (legacy)
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        # iPhone y iPad. El iPad es el dispositivo donde esta app se aprovecha
        # mejor —un rètol se lee de lejos—, y toda la competencia lo soporta.
        # A cambio, la ficha de la App Store exige un juego propio de capturas.
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEVELOPMENT_TEAM: TJ6V4QM3GB
    # Esquema compartido y versionado. Sin esto, el único esquema es el que
    # crea Xcode en xcuserdata, y `xcodegen generate` lo borra: cualquier
    # compilación por línea de órdenes falla hasta volver a abrir el proyecto.
    scheme:
      configVariants: []
